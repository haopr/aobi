<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>奥比岛仓库</title>
    <meta name="description" content="由玩家共同维护的奥比岛资料站，永久保存岛上的快乐时光。" />
    <link rel="icon" type="image/png" href="aobi.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="./"><img src="aobick.png" alt="奥比岛仓库" /></a>
        <div class="copyright-popover">
          <button class="copyright-help" type="button" aria-label="查看版权信息">?</button>
          <div class="copyright-panel" role="tooltip">
            <p>《奥比岛仓库》由玩家发起并共同维护，内容来自互联网公开信息。</p>
            <p>游戏内容版权归属广州百田 · <a href="http://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a></p>
          </div>
        </div>
      </header>

      <main>
        <section class="dialog" aria-label="奥比岛仓库提示框">
          <img class="dialog-bg" src="aobi_fixed_nobtn.svg" alt="" />
          <button class="dialog-close" type="button" aria-label="关闭提示框"><img src="aobi_close.svg" alt="" /></button>
          <div class="speech" role="status" aria-live="polite"></div>
          <div class="dialog-content">
            <img class="dialog-character" src="w_aunt.png" alt="W阿姨" />
            <p>《奥比岛仓库》由玩家 @极限的哥哥 发起，并由所有热爱奥比岛的玩家共同维护。仓库中的所有内容均来自互联网公开信息。本仓库将永久保存有关“奥比岛”的一切，无论何时，小奥比们都可以来到仓库重温岛上的快乐时光。</p>
          </div>
          <div class="dialog-actions">
            <button class="dialog-action" type="button" data-message="知道就好"><img src="aobi_button.svg" alt="" /><span>知道了</span></button>
            <button class="dialog-action" type="button" data-go-wiki="true"><img src="aobi_button.svg" alt="" /><span>立即前往</span></button>
          </div>
        </section>

        <nav class="tab-dock" aria-label="仓库入口">
          <img class="tab-bg" src="aobi-tab.svg" alt="" />
          <a class="tab-icon tab-map" href="/aobi/wiki/maps/" aria-label="地图"><img src="aobi-map.svg" alt="" /></a>
          <div class="tab-links">
            <a class="tab-button tab-button-short" href="/aobi/wiki/">Wiki</a>
            <a class="tab-button tab-button-long" href="/aobi/wiki/">图书馆二楼</a>
            <a class="tab-button tab-button-long" href="/aobi/wiki/">地下室</a>
            <a class="tab-button tab-button-long" href="/aobi/wiki/">神秘世界</a>
          </div>
          <a class="tab-icon tab-home" href="./" aria-label="首页"><img src="aobi-home.svg" alt="" /></a>
        </nav>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
