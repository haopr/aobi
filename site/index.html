<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>奥比岛仓库</title>
    <meta name="description" content="由玩家共同维护的奥比岛资料站，永久保存岛上的快乐时光。" />
    <link rel="icon" type="image/png" href="aobi.png" />
    <style>
      :root {
        --ink: #29495b;
        --muted: #5e7680;
        --blue: #3b8db4;
        --paper: rgba(255, 253, 244, .86);
        --line: rgba(255, 255, 255, .75);
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        min-height: 100svh;
        overflow-x: hidden;
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #a6d8ec url("aobibg.jpg") center / cover no-repeat fixed;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255,255,255,.05) 0%, rgba(255,244,201,.14) 62%, rgba(61,133,77,.28) 100%);
      }
      a { color: inherit; text-decoration: none; }

      .page {
        position: relative;
        z-index: 1;
        width: min(1120px, calc(100% - 48px));
        min-height: 100svh;
        margin: 0 auto;
        padding: 22px 0 20px;
        display: flex;
        flex-direction: column;
      }
      .topbar { display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 10px; color: #2a5266; font-size: 17px; font-weight: 800; letter-spacing: .08em; text-shadow: 0 1px rgba(255,255,255,.8); }
      .brand img { width: 48px; height: 48px; object-fit: contain; filter: drop-shadow(0 3px 2px rgba(27,72,78,.2)); }
      .nav { display: flex; gap: 8px; }
      .nav a { padding: 8px 14px; border: 1px solid var(--line); border-radius: 99px; color: #3b6573; background: rgba(255,255,255,.43); font-size: 13px; backdrop-filter: blur(8px); transition: .2s ease; }
      .nav a:hover { color: #22566e; background: rgba(255,255,255,.8); transform: translateY(-1px); }

      main { width: min(900px, 100%); margin: auto; text-align: center; }
      .hero {
        width: min(690px, 100%);
        margin: 0 auto;
        padding: 25px 34px 24px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(255,255,255,.62);
        box-shadow: 0 20px 55px rgba(49,102,117,.17), inset 0 1px rgba(255,255,255,.8);
        backdrop-filter: blur(12px);
      }
      .kicker { margin: 0 0 7px; color: #54879a; font-size: 13px; font-weight: 700; letter-spacing: .28em; }
      h1 { margin: 0; color: #285d78; font-size: clamp(40px, 6vw, 70px); line-height: 1.08; letter-spacing: .12em; text-shadow: 0 3px rgba(255,255,255,.9); }
      .lead { margin: 14px 0 0; color: #4f6d78; font-size: 15px; line-height: 1.8; }
      .lead strong { color: #316d83; }

      .sections { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 24px; text-align: left; }
      .section {
        position: relative;
        min-height: 162px;
        padding: 19px 19px 17px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.8);
        border-radius: 20px;
        background: var(--paper);
        box-shadow: 0 12px 28px rgba(47,97,111,.14);
        transition: transform .2s ease, box-shadow .2s ease;
        backdrop-filter: blur(9px);
      }
      .section::after { content: ""; position: absolute; right: -24px; top: -26px; width: 92px; height: 92px; border-radius: 50%; background: rgba(119,204,226,.18); }
      .section:nth-child(2)::after { background: rgba(235,171,117,.18); }
      .section:nth-child(3)::after { background: rgba(127,191,113,.2); }
      .section:hover { transform: translateY(-5px); box-shadow: 0 18px 34px rgba(47,97,111,.22); }
      .section h2 { position: relative; z-index: 1; margin: 0 0 7px; color: #2e6881; font-size: 22px; }
      .section p { position: relative; z-index: 1; min-height: 43px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
      .action { position: relative; z-index: 1; display: inline-block; margin-top: 12px; padding: 6px 12px; border-radius: 99px; color: #39748b; background: #e4f3f6; font-size: 12px; font-weight: 800; }
      .section.soon { background: rgba(255,250,237,.78); }
      .section.soon .action { color: #9b7134; background: #fff0cc; }

      footer { margin-top: auto; padding-top: 18px; color: #4f7178; font-size: 12px; line-height: 1.7; text-align: center; text-shadow: 0 1px rgba(255,255,255,.75); }
      footer p { margin: 2px 0; }
      footer a { text-decoration: underline; }

      @media (max-width: 700px) {
        body { overflow-y: auto; background-attachment: scroll; }
        .page { width: min(100% - 28px, 520px); padding: 14px 0 15px; }
        .nav { display: none; }
        main { margin: 8vh auto 7vh; }
        .hero { padding: 21px 18px 20px; border-radius: 22px; }
        h1 { font-size: clamp(36px, 12vw, 56px); letter-spacing: .08em; }
        .lead { font-size: 13px; }
        .sections { grid-template-columns: 1fr; gap: 10px; margin-top: 18px; }
        .section { min-height: 0; padding: 16px 17px; }
        .section p { min-height: 0; }
        .action { margin-top: 8px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="./"><img src="aobi.png" alt="奥比岛" /><span>奥比岛仓库</span></a>
        <nav class="nav" aria-label="快捷导航"><a href="/wiki/">Wiki</a><a href="#av">视听中心</a><a href="#archaeology">考古</a></nav>
      </header>

      <main>
        <section class="hero">
          <p class="kicker">欢迎回到岛上</p>
          <h1>奥比岛仓库</h1>
          <p class="lead">由玩家共同维护的资料站，<strong>把岛上的快乐好好保存下来。</strong></p>
        </section>
        <section class="sections" aria-label="仓库入口">
          <a class="section" href="/wiki/"><h2>Wiki</h2><p>地图、NPC、游戏资料与大事件，岛上的完整记忆。</p><span class="action">进入资料馆 →</span></a>
          <div class="section soon" id="av"><h2>视听中心</h2><p>音乐、动画、宣传片和玩家影像。</p><span class="action">即将开放</span></div>
          <div class="section soon" id="archaeology"><h2>考古</h2><p>早期版本、消失场景和线下活动。</p><span class="action">持续整理中</span></div>
        </section>
      </main>

      <footer>
        <p>《奥比岛仓库》由玩家发起并共同维护，内容来自互联网公开信息。</p>
        <p>游戏内容版权归属广州百田信息科技有限公司 · <a href="http://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a></p>
      </footer>
    </div>
  </body>
</html>
